
name: Generar APK Pidemás

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar tienda
        run: |
          mkdir -p www assets
          cp index.html manifest.webmanifest sw.js *.png www/
          cp pidemas-app-icon.png assets/icon.png
          cp pidemas-app-icon.png assets/icon-only.png
          cp pidemas-app-icon.png assets/icon-foreground.png

      - name: Instalar dependencias
        run: npm install

      - name: Preparar Google
        run: npx esbuild native-auth.js --bundle --format=iife --outfile=www/native-auth.js

      - name: Crear Android
        run: npx cap add android

      - name: Generar iconos nativos
        run: npx capacitor-assets generate --android

      - name: Configurar retorno Google
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          intent = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="com.pidemas.delivery" android:host="auth" android:path="/callback" />
                  </intent-filter>
          """
          if 'android:scheme="com.pidemas.delivery"' not in s:
              pos = s.find("</activity>")
              if pos < 0:
                  raise SystemExit("No se encontró la actividad Android")
              s = s[:pos] + intent + s[pos:]
              p.write_text(s)
          PY

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Descargar APK
        uses: actions/upload-artifact@v4
        with:
          name: Pidemas-Tienda-APK-Icono-Naranja
          path: android/app/build/outputs/apk/debug/app-debug.apk
